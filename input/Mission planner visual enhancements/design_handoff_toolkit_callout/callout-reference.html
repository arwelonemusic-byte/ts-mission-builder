<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolkit callout — design reference</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0d0f11; font-family: 'Roboto', Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  /* Panel context: 360px-wide floating panel, #202427, p-20px */
  .panel { width: 360px; box-sizing: border-box; background: #202427; border-radius: 12px; padding: 20px; box-shadow: 0px 16px 32px 0px rgba(0,0,0,0.4); }
  a { color: #f4db50; }
  a:hover { color: #f9e278; }
</style>
</head>
<body>
  <div class="panel">
    <div style="background:rgba(244,219,80,0.12);border:1px solid rgba(244,219,80,0.4);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;">
      <span style="font:700 14px/20px 'Roboto',sans-serif;color:#f4db50;">Important!</span>
      <span style="font:400 12px/16px 'Roboto',sans-serif;color:rgba(255,255,255,0.8);">Make sure you have the TS Mission Toolkit addon installed and updated:</span>
      <a href="https://reforger.armaplatform.com/workshop/6906F4528B72651A-TSMissionToolkit" target="_blank" rel="noopener" style="font:500 12px/16px 'Roboto',sans-serif;text-decoration:underline;text-underline-offset:2px;width:max-content;max-width:100%;">TS Mission Toolkit — Reforger Workshop</a>
    </div>
  </div>
</body>
</html>
